name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      force:
        description: "Override even if pending commits would already produce a higher bump"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Restrict manual trigger to repo admin
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "GingerGraham" ]; then
            echo "::error::Manual releases are restricted to the repo admin (GingerGraham). Triggered by: ${{ github.actor }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PAT_TOKEN }}

      - name: Detect release-worthy changes / prepare manual bump
        id: logging_change
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          # No tags yet → allow release (first release)
          if [ -z "$LAST_TAG" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # Manual workflow_dispatch: create bump commit for the requested level
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BUMP="${{ inputs.bump }}"
              FORCE="${{ inputs.force }}"

              # scripts/analyze-release-commits.sh sees GITHUB_EVENT_NAME=workflow_dispatch
              # here, so it reports what ALL pending commits would already produce
              # (unfiltered by path) — the same analysis analyzeCommitsCmd applies
              # again once semantic-release actually runs, so a requested "patch"
              # can't silently become a "minor" without warning.
              PENDING=$(scripts/analyze-release-commits.sh "$LAST_TAG")
              PENDING="${PENDING:-none}"

              rank() { case "$1" in none) echo 0 ;; patch) echo 1 ;; minor) echo 2 ;; major) echo 3 ;; esac; }

              if [ "$(rank "$PENDING")" -gt "$(rank "$BUMP")" ] && [ "$FORCE" != "true" ]; then
                  echo "::error::Pending commits since $LAST_TAG would already produce a '$PENDING' release, higher than the requested '$BUMP'. Re-run with force=true to override, or check: git log $LAST_TAG..HEAD --oneline"
                  exit 1
              fi

              case "$BUMP" in
                patch)
                  MSG="fix: trigger manual patch release [skip ci]"
                  ;;
                minor)
                  MSG="feat: trigger manual minor release [skip ci]"
                  ;;
                major)
                  MSG=$'feat!: trigger manual major release [skip ci]\n\nBREAKING CHANGE: manual major release requested via workflow_dispatch'
                  ;;
              esac

              echo "Manual trigger detected (bump=$BUMP, pending=$PENDING); creating release commit"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit --allow-empty -m "$MSG"

              # Set up credentials for push
              git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
              git push origin main

              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # Auto push: only release if a commit that itself touched logging.sh or
          # workbench.yml is also release-worthy by type (feat:/fix:/etc.) — a
          # feat:-typed commit that only touches CI config or docs must not bump
          # the deployable payload's version.
          NEXT_TYPE=$(scripts/analyze-release-commits.sh "$LAST_TAG")
          if [ -n "$NEXT_TYPE" ]; then
              echo "Release-worthy ($NEXT_TYPE) commit touching logging.sh/workbench.yml since $LAST_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
          else
              echo "No release-worthy logging.sh/workbench.yml commit since $LAST_TAG; skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.logging_change.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        if: steps.logging_change.outputs.changed == 'true'
        run: |
          npm install -g \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/exec@6 \
            conventional-changelog-conventionalcommits@8

      - name: Verify dependencies
        if: steps.logging_change.outputs.changed == 'true'
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          semantic-release --version

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        if: steps.logging_change.outputs.changed == 'true'
        run: npx semantic-release
