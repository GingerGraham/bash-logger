name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Run Test Suite

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install zsh, dash and busybox
        run: sudo apt-get update && sudo apt-get install -y zsh dash busybox

      # TEST_SHELLS drives the cross-shell suites (test_shell_compat, test_validator_equivalence,
      # test_posix_compat). TEST_REQUIRE_SHELLS makes a missing shell fail instead of skip.
      - name: Run tests
        env:
          TEST_PARALLEL_JOBS: 4
          TEST_SHELLS: bash,bash --posix,zsh,dash,busybox sh
          TEST_REQUIRE_SHELLS: zsh dash busybox
        run: |
          cd tests
          ./run_tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/
          retention-days: 30

  test-macos-bash32:
    permissions:
      contents: read
    runs-on: macos-latest
    name: Run Test Suite (macOS /bin/bash 3.2)
    # The default job timeout is 6 hours, which would hide a hung suite for that long
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Runner images can put a newer Homebrew bash first on PATH, and the tests start
      # nested bash processes. A PATH shim makes every bash call use Apple's bash 3.2.
      - name: Use /bin/bash for every bash call
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Confirm bash 3.2
        run: |
          bash --version | head -1
          bash -c '[[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == "3.2" ]]'

      - name: Run tests
        env:
          TEST_PARALLEL_JOBS: 3
        run: |
          cd tests
          ./run_tests.sh

  benchmark:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Per-message Benchmark
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install zsh, dash and busybox
        run: sudo apt-get update && sudo apt-get install -y zsh dash busybox

      # The base branch's logging.sh is the baseline in every shell where it runs (shells it
      # cannot run in are reported as "baseline unavailable"). The job fails if a run fails,
      # if a scenario is slower than the baseline by more than --max-ratio (default 1.15,
      # ignored under a 100 microsecond difference), or if lines-256k / lines-16k exceeds
      # --max-scaling (default 32; linear growth is 16). Every scenario runs, 5 rounds each.
      - name: Get baseline logging.sh
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git show "origin/${BASE_REF}:logging.sh" > "$RUNNER_TEMP/baseline-logging.sh"

      - name: Run benchmark
        shell: bash
        run: |
          scripts/bench-logging.sh --baseline "$RUNNER_TEMP/baseline-logging.sh" \
            bash "bash --posix" zsh dash "busybox sh" | tee bench-results.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30
