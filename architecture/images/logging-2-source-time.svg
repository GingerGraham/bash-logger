<rect x="51.5" y="1003.0" width="227.0" height="29.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="165.0" y="1020.9" text-anchor="middle" font-size="11" font-weight="bold">Scrub and set readonly COLOR_*</text>
<rect x="130.0" y="1057.0" width="228.0" height="58.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="244.0" y="1075.9" text-anchor="middle" font-size="11" font-weight="bold">CONFIG_MAX_* (once)</text><text x="244.0" y="1089.4" text-anchor="middle" font-size="10">LOGGER_PATH = '' unless already locked</text><text x="244.0" y="1102.9" text-anchor="middle" font-size="10">_LOGGER_DISCOVERY_DONE = false</text>
<rect x="170.0" y="1140.0" width="148.0" height="29.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="244.0" y="1157.9" text-anchor="middle" font-size="11" font-weight="bold">Define all functions</text>
