<text x="153.0" y="1306.1" text-anchor="middle" font-size="11" font-weight="bold">Wrap _log_message body via functions[]</text><text x="153.0" y="1319.6" text-anchor="middle" font-size="10">with the _LOGGER_BUSY re-entrancy guard</text>
<polygon points="244.0,1356.0 387.8,1385.5 244.0,1415.0 100.2,1385.5" fill="#fff2cc" stroke="#d6b656"/>
