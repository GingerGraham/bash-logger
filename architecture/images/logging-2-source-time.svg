<text x="245.0" y="79.9" text-anchor="middle" font-size="11" font-weight="bold">Detect shell family</text><text x="245.0" y="93.4" text-anchor="middle" font-size="10">_LOGGER_SHELL_FAMILY = bash | zsh | empty</text><text x="245.0" y="106.9" text-anchor="middle" font-size="10">version variable AND shell-only builtin (shopt / emulate)</text>
<rect x="106.5" y="144.0" width="277.0" height="43.0" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="245.0" y="162.1" text-anchor="middle" font-size="11" font-weight="bold">_LOGGER_BASH_HAS_ATTRS (bash ≥ 5.1)</text><text x="245.0" y="175.6" text-anchor="middle" font-size="10">define _is_readonly, _logger_readonly</text>
<polygon points="245.0,212.0 338.9,241.5 245.0,271.0 151.1,241.5" fill="#fff2cc" stroke="#d6b656"/>
<text x="245.0" y="238.1" text-anchor="middle" font-size="11" font-weight="bold">_LOGGER_ESC</text><text x="245.0" y="251.6" text-anchor="middle" font-size="10">readonly?</text>
<rect x="35.0" y="306.0" width="250.0" height="58.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="160.0" y="324.9" text-anchor="middle" font-size="11" font-weight="bold">Build control-character constants</text><text x="160.0" y="338.4" text-anchor="middle" font-size="10">ESC BEL CR TAB NEWLINE BOM, UTF-8 C1 list</text><text x="160.0" y="351.9" text-anchor="middle" font-size="10">then make them readonly</text>
<polygon points="244.0,389.0 365.3,418.5 244.0,448.0 122.7,418.5" fill="#fff2cc" stroke="#d6b656"/>
<text x="244.0" y="415.1" text-anchor="middle" font-size="11" font-weight="bold">_LOGGER_STRIP_C0</text><text x="244.0" y="428.6" text-anchor="middle" font-size="10">readonly?</text>
<rect x="36.5" y="483.0" width="247.0" height="58.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="160.0" y="501.9" text-anchor="middle" font-size="11" font-weight="bold">Build sanitiser constants</text><text x="160.0" y="515.4" text-anchor="middle" font-size="10">C0 strip set, bidi characters, sed expressions</text><text x="160.0" y="528.9" text-anchor="middle" font-size="10">then make them readonly</text>
<rect x="90.5" y="566.0" width="307.0" height="58.0" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="244.0" y="584.9" text-anchor="middle" font-size="11" font-weight="bold">Reset per-source state</text><text x="244.0" y="598.4" text-anchor="middle" font-size="10">[:ascii:] probe, *_into result variables, _LOGGER_BUSY=0</text><text x="244.0" y="611.9" text-anchor="middle" font-size="10">_LOGGER_TIME_BUILTIN, UTF-8 byte-class caches</text>
<polygon points="244.0,649.0 390.3,678.5 244.0,708.0 97.7,678.5" fill="#fff2cc" stroke="#d6b656"/>
<text x="244.0" y="675.1" text-anchor="middle" font-size="11" font-weight="bold">BASH_LOGGER_VERSION</text><text x="244.0" y="688.6" text-anchor="middle" font-size="10">readonly?</text>
<rect x="0.0" y="743.0" width="296.0" height="58.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="148.0" y="761.9" text-anchor="middle" font-size="11" font-weight="bold">First source only</text><text x="148.0" y="775.4" text-anchor="middle" font-size="10">unset inherited LOG_LEVEL_* and *_ERROR_REPORTED</text><text x="148.0" y="788.9" text-anchor="middle" font-size="10">readonly LOG_LEVEL_* (0-7), INIT, FATAL, version</text>
<rect x="72.5" y="826.0" width="343.0" height="58.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="244.0" y="844.9" text-anchor="middle" font-size="11" font-weight="bold">Reset settings to defaults (every source)</text><text x="244.0" y="858.4" text-anchor="middle" font-size="10">CONSOLE_LOG, LOG_FILE, LOG_FORMAT, CURRENT_LOG_LEVEL</text><text x="244.0" y="871.9" text-anchor="middle" font-size="10">USE_UTC, USE_JOURNAL, USE_COLORS, limits, SYSLOG_FACILITY</text>
<polygon points="244.0,909.0 338.7,938.5 244.0,968.0 149.3,938.5" fill="#fff2cc" stroke="#d6b656"/>
