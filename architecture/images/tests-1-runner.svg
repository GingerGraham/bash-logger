<text fill="#ffffff" x="481.0" y="21.4" text-anchor="middle" font-size="11" font-weight="bold">./run_tests.sh [--junit] [--output-dir D] [-j N] [-x] [suite…]</text>
<rect x="309.5" y="61.0" width="343.0" height="58.0" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="481.0" y="79.9" text-anchor="middle" font-size="11" font-weight="bold">main: parse options</text><text x="481.0" y="93.4" text-anchor="middle" font-size="10">PARALLEL_JOBS = -j | TEST_PARALLEL_JOBS | nproc (capped at 8)</text><text x="481.0" y="106.9" text-anchor="middle" font-size="10">--fail-fast forces PARALLEL_JOBS=1</text>
<rect x="275.5" y="144.0" width="411.0" height="58.0" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="481.0" y="162.9" text-anchor="middle" font-size="11" font-weight="bold">Select suites</text><text x="481.0" y="176.4" text-anchor="middle" font-size="10">none named → find tests/test_*.sh (sorted), minus test_example / test_helpers</text><text x="481.0" y="189.9" text-anchor="middle" font-size="10">named → tests/&lt;name&gt;.sh</text>
<rect x="298.5" y="227.0" width="365.0" height="29.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="481.0" y="244.9" text-anchor="middle" font-size="11" font-weight="bold">RESULTS_DIR = mktemp -d   (removed by an EXIT trap)</text>
<polygon points="481.0,281.0 605.9,303.0 481.0,325.0 356.1,303.0" fill="#fff2cc" stroke="#d6b656"/>
<text x="481.0" y="306.4" text-anchor="middle" font-size="11" font-weight="bold">PARALLEL_JOBS &gt; 1?</text>
<rect x="224.0" y="360.0" width="252.0" height="72.0" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="350.0" y="379.1" text-anchor="middle" font-size="11" font-weight="bold">Parallel: for each suite</text><text x="350.0" y="392.6" text-anchor="middle" font-size="10">wait_for_job_slot N</text><text x="350.0" y="406.1" text-anchor="middle" font-size="10">run_test_suite_with_progress … &amp;</text><text x="350.0" y="419.6" text-anchor="middle" font-size="10">(output → result_i.txt.output, status → .status)</text>
<rect x="0.0" y="553.0" width="212.0" height="58.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="106.0" y="571.9" text-anchor="middle" font-size="11" font-weight="bold">wait each PID in order</text><text x="106.0" y="585.4" text-anchor="middle" font-size="10">(status 127 → read result_i.txt.status)</text><text x="106.0" y="598.9" text-anchor="middle" font-size="10">then aggregate every suite</text>
<rect x="498.5" y="367.0" width="231.0" height="58.0" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="614.0" y="385.9" text-anchor="middle" font-size="11" font-weight="bold">Sequential: for each suite</text><text x="614.0" y="399.4" text-anchor="middle" font-size="10">run_test_suite … &amp; ; wait</text><text x="614.0" y="412.9" text-anchor="middle" font-size="10">aggregate at once; -x stops after a failure</text>
<rect x="317.0" y="498.0" width="264.0" height="43.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="449.0" y="516.1" text-anchor="middle" font-size="11" font-weight="bold">source test_helpers.sh</text><text x="449.0" y="529.6" text-anchor="middle" font-size="10">counters = 0, setup_test_suite → TEST_TMP_DIR</text>
<rect x="334.5" y="623.0" width="229.0" height="29.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="449.0" y="640.9" text-anchor="middle" font-size="11" font-weight="bold">trap 'write_suite_results $?' EXIT</text>
<rect x="321.0" y="677.0" width="256.0" height="43.0" rx="6" fill="#e0f2f1" stroke="#26a69a"/>
<text x="449.0" y="695.1" text-anchor="middle" font-size="11" font-weight="bold">source tests/test_&lt;suite&gt;.sh</text><text x="449.0" y="708.6" text-anchor="middle" font-size="10">the calls at the bottom of the file run each test</text>
<rect x="320.0" y="755.0" width="258.0" height="58.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="449.0" y="773.9" text-anchor="middle" font-size="11" font-weight="bold">write_suite_results (runs on any exit)</text><text x="449.0" y="787.4" text-anchor="middle" font-size="10">cleanup_test_suite; print ✓/✗ line</text><text x="449.0" y="800.9" text-anchor="middle" font-size="10">write the result file</text>
