<text x="165.0" y="421.1" text-anchor="middle" font-size="11" font-weight="bold">require_shell zsh || return 0</text><text x="165.0" y="434.6" text-anchor="middle" font-size="10">(missing → skip_test, or fail_test if in TEST_REQUIRE_SHELLS)</text>
<rect x="210.0" y="481.0" width="326.0" height="58.0" rx="6" fill="#e0f2f1" stroke="#26a69a"/>
<text x="373.0" y="499.9" text-anchor="middle" font-size="11" font-weight="bold">Act</text><text x="373.0" y="513.4" text-anchor="middle" font-size="10">log_* / set_* in-process, or bash -c / run_with_logger_in_shell</text><text x="373.0" y="526.9" text-anchor="middle" font-size="10">capture_output, capture_streams, run_with_timeout</text>
<rect x="242.0" y="606.0" width="262.0" height="72.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="373.0" y="625.1" text-anchor="middle" font-size="11" font-weight="bold">Assert</text><text x="373.0" y="638.6" text-anchor="middle" font-size="10">assert_equals, assert_contains, assert_matches</text><text x="373.0" y="652.1" text-anchor="middle" font-size="10">assert_file_contains / _not_contains / _empty …</text><text x="373.0" y="665.6" text-anchor="middle" font-size="10">assert_success / assert_failure      … || return</text>
<polygon points="373.0,703.0 466.1,732.5 373.0,762.0 279.9,732.5" fill="#fff2cc" stroke="#d6b656"/>
