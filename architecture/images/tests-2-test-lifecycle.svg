<text x="611.0" y="822.6" text-anchor="middle" font-size="11" font-weight="bold">pass_test</text><text x="611.0" y="836.1" text-anchor="middle" font-size="10">suite_passed++, print ✓</text>
<rect x="203.0" y="797.0" width="308.0" height="58.0" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="357.0" y="815.9" text-anchor="middle" font-size="11" font-weight="bold">fail_test MSG   (called by the assert_* helper)</text><text x="357.0" y="829.4" text-anchor="middle" font-size="10">suite_failed++, print ✗ + reason</text><text x="357.0" y="842.9" text-anchor="middle" font-size="10">FAILED_TEST_DETAILS += name: reason</text>
