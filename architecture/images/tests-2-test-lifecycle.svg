<text x="273.0" y="79.1" text-anchor="middle" font-size="11" font-weight="bold">start_test "Display name"</text><text x="273.0" y="92.6" text-anchor="middle" font-size="10">current_test, suite_tests++, TEST_START_TIME</text>
<rect x="116.0" y="129.0" width="314.0" height="72.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="273.0" y="148.1" text-anchor="middle" font-size="11" font-weight="bold">setup_test</text><text x="273.0" y="161.6" text-anchor="middle" font-size="10">source logging.sh again → every setting back to its default</text><text x="273.0" y="175.1" text-anchor="middle" font-size="10">TEST_DIR = mktemp -d "$TEST_TMP_DIR/test.XXXXXX"</text><text x="273.0" y="188.6" text-anchor="middle" font-size="10">TEST_STDOUT / TEST_STDERR paths</text>
<rect x="125.0" y="226.0" width="296.0" height="58.0" rx="6" fill="#e0f2f1" stroke="#26a69a"/>
<text x="273.0" y="244.9" text-anchor="middle" font-size="11" font-weight="bold">Arrange</text><text x="273.0" y="258.4" text-anchor="middle" font-size="10">init_logger --quiet …, LOG_FILE="$TEST_DIR/x.log"</text><text x="273.0" y="271.9" text-anchor="middle" font-size="10">optional stub: _find_and_validate_logger() { return 0; }</text>
<polygon points="273.0,309.0 370.2,338.5 273.0,368.0 175.8,338.5" fill="#fff2cc" stroke="#d6b656"/>
<text x="273.0" y="335.1" text-anchor="middle" font-size="11" font-weight="bold">needs another</text><text x="273.0" y="348.6" text-anchor="middle" font-size="10">shell?</text>
