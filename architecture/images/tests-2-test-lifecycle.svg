<text x="165.0" y="569.1" text-anchor="middle" font-size="11" font-weight="bold">skip_test REASON</text><text x="165.0" y="582.6" text-anchor="middle" font-size="10">suite_skipped++, print ⊘</text>
<rect x="163.5" y="880.0" width="387.0" height="43.0" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="357.0" y="898.1" text-anchor="middle" font-size="11" font-weight="bold">JUNIT_OUTPUT=true → _add_junit_testcase pass | fail | skip</text><text x="357.0" y="911.6" text-anchor="middle" font-size="10">(_get_test_duration, _junit_xml_escape) → CURRENT_SUITE_TESTCASES</text>
